# Machine-readable template — source of truth for 评审就绪的标准需求规格说明书
spec_version: "0.1"
id: SPEC-XXX-001
title:
  zh: 模块 · 功能名
  en: Module · Feature
status: draft   # draft | ready
baseline:
  zh: 对照基线一句话
in_scope: []
out_of_scope: []
actors: []
permissions: []        # actor + can；复杂授权在 rules[] 定义 action/object/state/surface/enforcement
defaults: {}
states:
  lifecycle: []
  labels: {}          # {state_id: {zh, of}} 人读用中文，禁止只写英文 id
  action_labels: {}   # {action_id: {zh}} 业务动作中文名
  value_labels: {}    # {created: {zh: 已创建}} 枚举值中文；也可由 lifecycle 前缀推导
  action_matrix: []   # [{state, action, allowed, zh}]
ui:
  entry:
    zh: 入口说明
  wireframe: |
    ┌─ 页面 ─┐
    │        │
    └────────┘
  controls: []
empty_states:
  example_blocked:
    zh: 「占位」拦截/空态文案原文（与界面一致后替换）
object_ai:
  enabled: false
behaviors:
  - id: B1
    step_id: 1
    name:
      zh: 「占位」主路径第一步
    given:
      zh: 「占位」前置状态
    when:
      zh: 「占位」用户动作
    then:
      zh: 「占位」可观察结果（数据/状态/文案）
    # 以下按风险采用：涉及写入、权限、跨对象副作用或异步处理时不要省略
    entry_ref: surface_example
    actor_refs: []
    reads: []           # data_contracts[].id
    writes: []          # data_contracts[].id
    action_refs: []     # states.action_matrix[].action
    state_transitions: []
    exceptions: []      # {id, trigger, visible_result, preserved_facts, retry, recovery}
    idempotency:
      zh: 「占位」重复提交如何识别，以及不得重复产生哪些事实
    recovery:
      zh: 「占位」部分成功或依赖失败后如何恢复
    permission_refs: [] # permissions[].rules[].id
    acceptance_refs: [AC-01]
acceptance:
  - id: AC-01
    behavior: B1
    zh: 「占位」Given…When…Then… 可验收表述
    # 可选追踪：actor_refs/object_refs/state_refs/permission_refs/surface_refs/path
pending: []   # 事实缺口用 kind=fact；产品取舍用 kind=decision + options/recommendation/tradeoff
overview:
  summary:
    zh: 「占位」一段话说清：谁在什么场景做什么，本规格覆盖到哪条边界
  design_principles:
    - zh: 「占位」为什么这样设计（评审时最常被问的取舍写在这里）
  environment_constraints: []   # 部署/依赖/合规等产品硬约束；不要在这里发明技术栈
architecture:                   # 产品/信息架构：对象、页面/模块及信息流；禁止写技术组件堆叠图
  note:
    zh: 「占位」一句话说明本期产品对象、页面层级与信息流
  mermaid: |-
    flowchart LR
      User["用户"] --> Entry["占位：产品入口"]
      Entry --> Object["占位：核心业务对象"]
  surfaces:                    # 页面/入口/输出物回答什么问题，读取或修改哪些对象
    - id: surface_example
      zh: 「占位」页面名
      kind: detail
      question:
        zh: 「占位」用户来到这里要回答什么
      reads: [ProductObject]
      writes: []
      links_to: []
      state_source:
        zh: 「占位」不得维护第二套状态；写明权威结论来源
responsibilities:               # 产品模块负责/不负责；不是研发团队或技术服务职责
  - role: product_module
    zh: 「占位」产品模块
    owns:
      - zh: 「占位」本期包含的页面、信息或能力
    not_owns:
      - zh: 「占位」明确不包含的边界
data_contracts:                 # 产品定义的业务实体、输入输出、字段含义与规则
  - id: ProductObject
    zh: 「占位」核心业务对象
    purpose:
      zh: 「占位」对象负责表达什么业务事实
    ownership:
      zh: 「占位」归属哪个业务边界
    identity:
      zh: 「占位」唯一性或业务标识
    kind: fact                  # fact | event | aggregate | view
    relationships: []          # {target, cardinality, zh}
    lifecycle_refs: []
    producer_refs: []          # behavior id
    consumer_refs: [surface_example]
    history_current_boundary:
      zh: 「占位」历史事实与当前结论如何区分
    fields:
      - name: example_field
        zh: 「占位」字段中文名
        type: string
        desc:
          zh: 「占位」业务含义与约束
    rules:
      - zh: 「占位」关键业务规则
error_codes:                    # 产品错误定义：含义、触发条件、可重试性与用户文案
  - code: PRODUCT_ERROR
    zh: 「占位」错误含义
    trigger:
      zh: 「占位」触发条件
    retryable: false
    user_copy:
      zh: 「占位」用户看到的原文文案
decisions:
  - id: D-PROTOTYPE
    question:
      zh: 本次需求评审是否需要可交互原型？如需要，采用什么载体？
    options:
      - id: no_prototype
        zh: 不需要原型，仅评审标准文档
      - id: static_html
        zh: 静态 HTML，可直接打开
      - id: local_service
        zh: 本地服务，可运行交互流程
      - id: other
        zh: 其他载体（在 note 写明）
    chosen:
    status: pending
    owner: 产品经理
    recommendation: no_prototype
    note:
      zh: 待产品经理在接收原料后的第一轮确认
# 其他 decisions: [{id: D-01, question, options, chosen, status: decided|pending, date, note}]
# 所有未拍板 decision 在 status=ready 时 FAIL
sources: []   # {id, kind, path, status: registered|superseded}
source_claims: []
  # {id, source_ref, quote_or_summary, evidence, kind, disposition, spec_refs, confidence}
  # disposition: covered | omitted | assumption | conflict | out_of_scope | pending
