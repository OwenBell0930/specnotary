# Machine-readable spec template (source of truth)
# 机读规格模板（主源）。优先 YAML；也可存为 JSON（字段同义）。

spec_version: "0.1"
id: SPEC-EXAMPLE-001
title:
  zh: 示例功能
  en: Example feature
status: draft   # draft | ready | deprecated

# Scope
in_scope:
  - zh: 示例范围内事项
    en: Example in-scope item
out_of_scope:
  - zh: 示例范围外事项
    en: Example out-of-scope item
open_questions:
  - id: Q1
    zh: 待决问题示例
    en: Example open question

# Actors & permissions
actors:
  - id: operator
    zh: 操作者
    en: Operator
permissions:
  - actor: operator
    can: [view, edit]

# Object AI block — requiredness depends on project.object_ai_weight
object_ai:
  enabled: false
  tools_boundary: []
  failure_fallback: ""
  human_takeover_when: []
  unacceptable_outputs: []

# Behaviors (observable)
behaviors:
  - id: B1
    name:
      zh: 主路径示例
      en: Primary path example
    given:
      zh: 前置条件
      en: Precondition
    when:
      zh: 操作
      en: Action
    then:
      zh: 可观察结果
      en: Observable result
    defaults:
      zh: 默认值说明
      en: Defaults

# Acceptance
acceptance:
  - id: A1
    behavior: B1
    zh: 验收说法
    en: Acceptance statement
