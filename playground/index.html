<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SpecNotary 试用 — 点按钮看不合格需求怎么被拦住</title>
<style>
  :root{--bg:#0b1220;--panel:#0f172a;--line:#1e293b;--text:#e2e8f0;--muted:#94a3b8;
        --red:#f87171;--amber:#fbbf24;--green:#4ade80;--blue:#60a5fa;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:20px 24px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
  header h1{margin:0;font-size:20px}
  header .tag{color:var(--muted);font-size:13px}
  header a{color:var(--blue);text-decoration:none;font-size:13px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 24px}
  button{background:#1d4ed8;border:0;color:#fff;padding:8px 14px;border-radius:8px;
         font-size:13px;cursor:pointer}
  button.secondary{background:#334155}
  button:disabled{opacity:.45;cursor:wait}
  main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 24px 24px;height:calc(100vh - 130px)}
  @media (max-width:900px){main{grid-template-columns:1fr;height:auto}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         display:flex;flex-direction:column;min-height:320px;overflow:hidden}
  .panel h2{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.08em;
            text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  textarea{flex:1;background:transparent;color:var(--text);border:0;outline:none;
           padding:14px;font:12.5px/1.55 "SF Mono",Menlo,Consolas,monospace;resize:none;white-space:pre}
  #out{flex:1;overflow:auto;padding:14px;font:12.5px/1.6 "SF Mono",Menlo,Consolas,monospace;
       white-space:pre-wrap;word-break:break-word}
  .fail{color:var(--red)} .warn{color:var(--amber)} .pass{color:var(--green)}
  .gap{color:var(--blue)} .mut{color:var(--muted)}
  footer{padding:0 24px 20px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>SpecNotary 试用</h1>
  <span class="tag">给产品经理 · 推荐 Cursor / Codex · 浏览器点按钮即可 · 不用安装 · 内容不上传</span>
  <a href="../README.md">← 回说明</a>
</header>
<div class="bar">
  <button id="btn-bad" class="secondary" disabled>试一份不合格的需求</button>
  <button id="btn-good" class="secondary" disabled>试一份合格的需求</button>
  <button id="btn-check" disabled>再检查一次</button>
  <button id="btn-human" class="secondary" disabled>看人能读的说明书</button>
</div>
<main>
  <div class="panel"><h2>需求规格（内部格式，试用时可忽略）</h2>
    <textarea id="src" spellcheck="false" placeholder="点上方按钮即可，这里会自动填入样例"></textarea>
  </div>
  <div class="panel"><h2>检查结果</h2>
    <div id="out"><span class="mut">正在准备试用环境（首次大约十几秒）…</span></div>
  </div>
</main>
<footer>试用只检查规格正文。要用在自己的需求上：把这个文件夹发给 Cursor 或 Codex，请它按 skills/SKILL.md 帮你安装。</footer>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const out = $("out");
const show = (html) => { out.innerHTML = html; };
const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const SOURCES = ["__init__.py","spec_io.py","spec_render.py","pm_view.py","libspec.py","libproto.py","check.py","generate_human.py","report.py","sync.py","markers.py","mcp.py","cli.py"];
const SCHEMAS = ["machine-spec.schema.json","prototype-manifest.schema.json"];
const EXAMPLES = {
  bad:  "../examples/case-order-cancel-bad/machine/spec.yaml",
  good: "../examples/case-order-cancel-bad/machine/spec.fixed.yaml",
};

let pyodide = null;

async function fetchText(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`fetch ${url}: ${r.status}`);
  return await r.text();
}

async function boot(){
  try{
    pyodide = await loadPyodide();
    show('<span class="mut">正在加载检查能力…</span>');
    await pyodide.loadPackage(["pyyaml","jsonschema"]);
    show('<span class="mut">正在加载样例检查器…</span>');
    pyodide.FS.mkdirTree("/lib/specnotary/schemas");
    for(const f of SOURCES){
      pyodide.FS.writeFile(`/lib/specnotary/${f}`, await fetchText(`../src/specnotary/${f}`));
    }
    for(const f of SCHEMAS){
      pyodide.FS.writeFile(`/lib/specnotary/schemas/${f}`, await fetchText(`../src/specnotary/schemas/${f}`));
    }
    pyodide.runPython(`
import sys
sys.path.insert(0, "/lib")
import yaml, json
from specnotary.libspec import validate, ready_gap, render_human
from specnotary.pm_view import humanize_finding, status_label

def _load(text):
    return yaml.safe_load(text)

def pg_check(text):
    try:
        data = _load(text)
    except Exception as exc:
        return json.dumps({"error": f"YAML 解析失败: {exc}"}, ensure_ascii=False)
    if not isinstance(data, dict):
        return json.dumps({"error": "根节点必须是对象"}, ensure_ascii=False)
    result = validate(data, {})
    gap = ready_gap(data, {}) if data.get("status") != "ready" else []
    return json.dumps({
        "status": status_label(str(data.get("status") or "")), "id": data.get("id"),
        "fail": [humanize_finding(e) for e in result["fail"]],
        "warn": [humanize_finding(w) for w in result["warn"]],
        "ready_gap": gap,
    }, ensure_ascii=False)

def pg_human(text):
    try:
        data = _load(text)
    except Exception as exc:
        return f"YAML 解析失败: {exc}"
    if not isinstance(data, dict):
        return "根节点必须是对象"
    return render_human(data, source="playground", gate_mode="degraded")
`);
    for(const id of ["btn-bad","btn-good","btn-check","btn-human"]) $(id).disabled = false;
    show('<span class="mut">就绪。点「试一份不合格的需求」或「试一份合格的需求」即可。\n\n要用在自己的需求上：把这个文件夹发给 Cursor 或 Codex，请它按 skills/SKILL.md 帮你安装。</span>');
  }catch(err){
    show(`<span class="fail">加载失败：${esc(String(err))}</span>\n<span class="mut">试用需要能上网。失败后刷新页面再试一次。</span>`);
  }
}

function renderVerdict(raw){
  const v = JSON.parse(raw);
  if(v.error) return `<span class="fail">${esc(v.error)}</span>`;
  let html = `<span class="mut">规格编号：${esc(String(v.id))} · 进度：${esc(String(v.status))}</span>\n`;
  html += `必须改：${v.fail.length} 条\n需要你拍板：${v.warn.length} 条\n`;
  for(const e of v.fail) html += `<span class="fail">必须改：${esc(e)}</span>\n`;
  for(const w of v.warn) html += `<span class="warn">需要你拍板：${esc(w)}</span>\n`;
  if(v.ready_gap && v.ready_gap.length){
    html += `<span class="mut">翻成终稿前还差 ${v.ready_gap.length} 条</span>\n`;
    for(const g of v.ready_gap) html += `<span class="gap">还差：${esc(g)}</span>\n`;
  }
  html += v.fail.length ? `\n<span class="fail">结论：结构未通过。RESULT: FAIL</span>` : `\n<span class="pass">结论：结构通过。RESULT: PASS</span>`;
  if(!v.fail.length && v.warn.length) html += `\n<span class="mut">结构可以过关，但仍有需要你拍板的条目</span>`;
  return html;
}

$("btn-bad").onclick  = async () => {
  $("src").value = await fetchText(EXAMPLES.bad);
  $("btn-check").click();
};
$("btn-good").onclick = async () => {
  $("src").value = await fetchText(EXAMPLES.good);
  $("btn-check").click();
};
$("btn-check").onclick = () => {
  const fn = pyodide.globals.get("pg_check");
  try { show(renderVerdict(fn($("src").value))); } finally { fn.destroy(); }
};
$("btn-human").onclick = () => {
  const fn = pyodide.globals.get("pg_human");
  try { show(`<span class="mut">说明书原文如下（试用环境不钉内容指纹）</span>\n\n${esc(fn($("src").value))}`); }
  finally { fn.destroy(); }
};

boot();
</script>
</body>
</html>
