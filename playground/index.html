<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SpecAnvil Playground — 需求规格的 ESLint，浏览器直接跑</title>
<style>
  :root{--bg:#0b1220;--panel:#0f172a;--line:#1e293b;--text:#e2e8f0;--muted:#94a3b8;
        --red:#f87171;--amber:#fbbf24;--green:#4ade80;--blue:#60a5fa;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:20px 24px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
  header h1{margin:0;font-size:20px}
  header .tag{color:var(--muted);font-size:13px}
  header a{color:var(--blue);text-decoration:none;font-size:13px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 24px}
  button{background:#1d4ed8;border:0;color:#fff;padding:8px 14px;border-radius:8px;
         font-size:13px;cursor:pointer}
  button.secondary{background:#334155}
  button:disabled{opacity:.45;cursor:wait}
  main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 24px 24px;height:calc(100vh - 130px)}
  @media (max-width:900px){main{grid-template-columns:1fr;height:auto}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         display:flex;flex-direction:column;min-height:320px;overflow:hidden}
  .panel h2{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.08em;
            text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  textarea{flex:1;background:transparent;color:var(--text);border:0;outline:none;
           padding:14px;font:12.5px/1.55 "SF Mono",Menlo,Consolas,monospace;resize:none;white-space:pre}
  #out{flex:1;overflow:auto;padding:14px;font:12.5px/1.6 "SF Mono",Menlo,Consolas,monospace;
       white-space:pre-wrap;word-break:break-word}
  .fail{color:var(--red)} .warn{color:var(--amber)} .pass{color:var(--green)}
  .gap{color:var(--blue)} .mut{color:var(--muted)}
  footer{padding:0 24px 20px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>SpecAnvil Playground</h1>
  <span class="tag">确定性门禁在你的浏览器里跑（Pyodide）· 零安装 · 不上传任何内容</span>
  <a href="../README.md">← 回 README</a>
</header>
<div class="bar">
  <button id="btn-bad" class="secondary" disabled>载入坏稿样例（会 FAIL）</button>
  <button id="btn-good" class="secondary" disabled>载入修好稿（会 PASS）</button>
  <button id="btn-check" disabled>跑门禁 check</button>
  <button id="btn-human" class="secondary" disabled>生成人读视图</button>
</div>
<main>
  <div class="panel"><h2>machine spec (YAML) — 唯一准据</h2>
    <textarea id="src" spellcheck="false" placeholder="# 粘贴你的机读规格，或点上方按钮载入样例"></textarea>
  </div>
  <div class="panel"><h2>gate verdict</h2>
    <div id="out"><span class="mut">正在加载 Python 运行时（首次约 10–20 秒）…</span></div>
  </div>
</main>
<footer>门禁零 LLM：Schema + 确定性规则。Playground 只做机读本体校验（人读/原型防漂需本地文件系统，请用 CLI）。</footer>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const out = $("out");
const show = (html) => { out.innerHTML = html; };
const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const SOURCES = ["__init__.py","libspec.py","libproto.py","check.py","generate_human.py","report.py","sync.py","markers.py","mcp.py","cli.py"];
const SCHEMAS = ["machine-spec.schema.json","prototype-manifest.schema.json"];
const EXAMPLES = {
  bad:  "../examples/case-order-cancel-bad/machine/spec.yaml",
  good: "../examples/case-order-cancel-bad/machine/spec.fixed.yaml",
};

let pyodide = null;

async function fetchText(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`fetch ${url}: ${r.status}`);
  return await r.text();
}

async function boot(){
  try{
    pyodide = await loadPyodide();
    show('<span class="mut">运行时就绪，加载依赖（pyyaml / jsonschema）…</span>');
    await pyodide.loadPackage(["pyyaml","jsonschema"]);
    show('<span class="mut">加载 SpecAnvil 源码…</span>');
    pyodide.FS.mkdirTree("/lib/specanvil/schemas");
    for(const f of SOURCES){
      pyodide.FS.writeFile(`/lib/specanvil/${f}`, await fetchText(`../src/specanvil/${f}`));
    }
    for(const f of SCHEMAS){
      pyodide.FS.writeFile(`/lib/specanvil/schemas/${f}`, await fetchText(`../src/specanvil/schemas/${f}`));
    }
    pyodide.runPython(`
import sys
sys.path.insert(0, "/lib")
import yaml, json
from specanvil.libspec import validate, ready_gap, render_human

def _load(text):
    return yaml.safe_load(text)

def pg_check(text):
    try:
        data = _load(text)
    except Exception as exc:
        return json.dumps({"error": f"YAML 解析失败: {exc}"}, ensure_ascii=False)
    if not isinstance(data, dict):
        return json.dumps({"error": "根节点必须是对象"}, ensure_ascii=False)
    result = validate(data, {})
    gap = ready_gap(data, {}) if data.get("status") != "ready" else []
    return json.dumps({
        "status": data.get("status"), "id": data.get("id"),
        "fail": result["fail"], "warn": result["warn"], "ready_gap": gap,
    }, ensure_ascii=False)

def pg_human(text):
    try:
        data = _load(text)
    except Exception as exc:
        return f"YAML 解析失败: {exc}"
    if not isinstance(data, dict):
        return "根节点必须是对象"
    return render_human(data, source="playground", gate_mode="degraded")
`);
    for(const id of ["btn-bad","btn-good","btn-check","btn-human"]) $(id).disabled = false;
    show('<span class="mut">就绪。载入样例或粘贴你的机读 YAML，然后跑门禁。\n\n注：Playground 属降级环境（gate_mode: degraded 语义）——只校验机读本体；\n人读/原型防漂涉及本地文件，请用 CLI 获得完整 hard 判定。</span>');
  }catch(err){
    show(`<span class="fail">加载失败：${esc(String(err))}</span>\n<span class="mut">Playground 需要网络加载 Pyodide CDN 与仓库源码。</span>`);
  }
}

function renderVerdict(raw){
  const v = JSON.parse(raw);
  if(v.error) return `<span class="fail">${esc(v.error)}</span>`;
  let html = `<span class="mut">id: ${esc(String(v.id))} · status: ${esc(String(v.status))}</span>\n`;
  html += `FAIL_COUNT: ${v.fail.length}\nWARN_COUNT: ${v.warn.length}\n`;
  for(const e of v.fail) html += `<span class="fail">FAIL: ${esc(e)}</span>\n`;
  for(const w of v.warn) html += `<span class="warn">WARN: ${esc(w)}</span>\n`;
  if(v.ready_gap && v.ready_gap.length){
    html += `<span class="mut">READY_GAP_COUNT: ${v.ready_gap.length}（翻成 ready 还会新增）</span>\n`;
    for(const g of v.ready_gap) html += `<span class="gap">READY-GAP: ${esc(g)}</span>\n`;
  }
  html += v.fail.length ? `\n<span class="fail">RESULT: FAIL</span>` : `\n<span class="pass">RESULT: PASS</span>`;
  if(!v.fail.length && v.warn.length) html += `\n<span class="mut">NOTE: PASS with WARN</span>`;
  return html;
}

$("btn-bad").onclick  = async () => { $("src").value = await fetchText(EXAMPLES.bad);  show('<span class="mut">坏稿已载入——跑门禁看它怎么被打死。</span>'); };
$("btn-good").onclick = async () => { $("src").value = await fetchText(EXAMPLES.good); show('<span class="mut">修好稿已载入——跑门禁应 PASS。</span>'); };
$("btn-check").onclick = () => {
  const fn = pyodide.globals.get("pg_check");
  try { show(renderVerdict(fn($("src").value))); } finally { fn.destroy(); }
};
$("btn-human").onclick = () => {
  const fn = pyodide.globals.get("pg_human");
  try { show(`<span class="mut"># 人读视图（markdown 原文；CLI 版含 hard 哈希链）</span>\n\n${esc(fn($("src").value))}`); }
  finally { fn.destroy(); }
};

boot();
</script>
</body>
</html>
