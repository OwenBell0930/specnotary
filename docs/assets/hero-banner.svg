<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="SpecAnvil hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#0B3A5C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="#38BDF8" fill-opacity="0.08"/>
  <circle cx="200" cy="420" r="140" fill="#22D3EE" fill-opacity="0.06"/>

  <text x="80" y="92" fill="#7DD3FC" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="3">OWENBELL · SPEC ENGINEERING</text>
  <text x="80" y="160" fill="#F8FAFC" font-family="Helvetica Neue,Arial,sans-serif" font-size="52" font-weight="700">SpecAnvil</text>
  <text x="80" y="210" fill="#CBD5E1" font-family="Helvetica Neue,Arial,sans-serif" font-size="22">CLI + Scaffold + Skill</text>
  <text x="80" y="250" fill="#94A3B8" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">Dev-ready specs · machine YAML as SSOT · FAIL/WARN gates</text>

  <g filter="url(#glow)">
    <rect x="80" y="300" width="210" height="88" rx="14" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="185" y="340" text-anchor="middle" fill="#E0F2FE" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700">Machine YAML</text>
    <text x="185" y="366" text-anchor="middle" fill="#94A3B8" font-family="Helvetica Neue,Arial,sans-serif" font-size="13">SSOT</text>

    <rect x="330" y="300" width="210" height="88" rx="14" fill="url(#card)" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="435" y="340" text-anchor="middle" fill="#D1FAE5" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700">Human Spec</text>
    <text x="435" y="366" text-anchor="middle" fill="#94A3B8" font-family="Helvetica Neue,Arial,sans-serif" font-size="13">wireframe · AC</text>

    <rect x="580" y="300" width="210" height="88" rx="14" fill="url(#card)" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="685" y="340" text-anchor="middle" fill="#FEF3C7" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700">CLI Gate</text>
    <text x="685" y="366" text-anchor="middle" fill="#94A3B8" font-family="Helvetica Neue,Arial,sans-serif" font-size="13">FAIL=0 to PASS</text>
  </g>

  <path d="M290 344 H330" stroke="#64748B" stroke-width="2"/>
  <polygon points="326,338 338,344 326,350" fill="#64748B"/>
  <path d="M540 344 H580" stroke="#64748B" stroke-width="2"/>
  <polygon points="576,338 588,344 576,350" fill="#64748B"/>

  <rect x="840" y="90" width="380" height="320" rx="16" fill="#020617" stroke="#334155" stroke-width="2"/>
  <circle cx="868" cy="118" r="6" fill="#F87171"/>
  <circle cx="890" cy="118" r="6" fill="#FBBF24"/>
  <circle cx="912" cy="118" r="6" fill="#4ADE80"/>
  <text x="940" y="123" fill="#64748B" font-family="Menlo,Consolas,monospace" font-size="12">run-check.sh</text>
  <text x="868" y="168" fill="#93C5FD" font-family="Menlo,Consolas,monospace" font-size="13">gate_mode: hard</text>
  <text x="868" y="198" fill="#F87171" font-family="Menlo,Consolas,monospace" font-size="13">FAIL_COUNT: 7</text>
  <text x="868" y="228" fill="#FBBF24" font-family="Menlo,Consolas,monospace" font-size="13">WARN_COUNT: 4</text>
  <text x="868" y="258" fill="#FCA5A5" font-family="Menlo,Consolas,monospace" font-size="12">· ready but open_questions</text>
  <text x="868" y="282" fill="#FCA5A5" font-family="Menlo,Consolas,monospace" font-size="12">· missing ui / states</text>
  <text x="868" y="306" fill="#FCA5A5" font-family="Menlo,Consolas,monospace" font-size="12">· AC not observable</text>
  <text x="868" y="350" fill="#4ADE80" font-family="Menlo,Consolas,monospace" font-size="13">→ fix → RESULT: PASS</text>
  <text x="868" y="380" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="12">blocks fake-detailed specs</text>
</svg>
