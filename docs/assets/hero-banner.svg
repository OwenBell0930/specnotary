<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="SpecNotary turns raw requirements into review-ready product proposals for product managers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="55%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B5266"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#22D3EE" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <circle cx="1110" cy="40" r="210" fill="#38BDF8" fill-opacity="0.09"/>
  <circle cx="160" cy="470" r="170" fill="#2DD4BF" fill-opacity="0.08"/>

  <text x="72" y="64" fill="#7DD3FC" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" letter-spacing="2">FOR PRODUCT MANAGERS · AI-ASSISTED REQUIREMENTS REVIEW</text>
  <text x="72" y="130" fill="#F8FAFC" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="50" font-weight="750">SpecNotary</text>
  <text x="72" y="178" fill="#FFFFFF" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="650">把零散需求，变成经得起评审的产品方案</text>
  <text x="72" y="214" fill="#B6D5E4" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="16">目标 · 边界 · 架构 · 流程 · UX，在评审前形成清晰、可追溯的统一材料</text>

  <g filter="url(#glow)">
    <rect x="72" y="266" width="216" height="104" rx="16" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.65"/>
    <text x="180" y="306" text-anchor="middle" fill="#E0F2FE" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="750">Draft</text>
    <text x="180" y="335" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="650">高质量起草</text>
    <text x="180" y="356" text-anchor="middle" fill="#A9C4D4" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="12">目标 · 边界 · 架构</text>

    <rect x="320" y="266" width="216" height="104" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.72"/>
    <text x="428" y="306" text-anchor="middle" fill="#EDE9FE" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="750">Review</text>
    <text x="428" y="335" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="650">产品质量审查</text>
    <text x="428" y="356" text-anchor="middle" fill="#C4B5FD" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="12">核心 · 流程 · UX</text>

    <rect x="568" y="266" width="216" height="104" rx="16" fill="url(#card)" stroke="#34D399" stroke-opacity="0.72"/>
    <text x="676" y="306" text-anchor="middle" fill="#D1FAE5" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="750">Gate</text>
    <text x="676" y="335" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="650">确定性结构门禁</text>
    <text x="676" y="356" text-anchor="middle" fill="#A7F3D0" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="12">追溯 · 一致 · 防漂</text>
  </g>

  <path d="M288 318 H320" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.75"/>
  <polygon points="314,312 326,318 314,324" fill="#7DD3FC"/>
  <path d="M536 318 H568" stroke="#C4B5FD" stroke-width="2" stroke-opacity="0.75"/>
  <polygon points="562,312 574,318 562,324" fill="#C4B5FD"/>

  <rect x="842" y="62" width="366" height="346" rx="20" fill="url(#pack)" stroke="#BAE6FD" stroke-width="2" filter="url(#glow)"/>
  <rect x="874" y="88" width="150" height="28" rx="14" fill="#0E7490"/>
  <text x="949" y="107" text-anchor="middle" fill="#ECFEFF" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1">REVIEW-READY PACK</text>
  <text x="874" y="157" fill="#0F172A" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="750">一套材料，支撑有效评审</text>
  <line x1="874" y1="177" x2="1174" y2="177" stroke="#BAE6FD" stroke-width="2"/>

  <circle cx="890" cy="214" r="11" fill="#0F766E"/>
  <path d="M885 214 L889 218 L896 209" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="916" y="220" fill="#164E63" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="650">标准产品规格</text>

  <circle cx="890" cy="262" r="11" fill="#7C3AED"/>
  <path d="M885 262 L889 266 L896 257" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="916" y="268" fill="#164E63" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="650">产品质量审查报告</text>

  <circle cx="890" cy="310" r="11" fill="#0284C7"/>
  <path d="M885 310 L889 314 L896 305" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="916" y="316" fill="#164E63" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="650">结构门禁结果</text>

  <circle cx="890" cy="358" r="11" fill="#059669"/>
  <path d="M885 358 L889 362 L896 353" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="916" y="364" fill="#164E63" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="650">可选原型追溯</text>

  <rect x="72" y="411" width="712" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.09" stroke="#7DD3FC" stroke-opacity="0.35"/>
  <text x="428" y="436" text-anchor="middle" fill="#E0F2FE" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="650">完整流程 /write-spec · 独立调用 Draft / Review / Gate · 适配 Cursor 与 Codex</text>
</svg>
