<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Before after order cancel">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#159947"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#F8FAFC"/>
  <text x="640" y="40" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="700">假详细 → 可开发规格（未发货取消）</text>
  <text x="640" y="70" text-anchor="middle" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">同一业务：口号式 PRD vs 施工图密度机读字段</text>

  <rect x="40" y="100" width="560" height="480" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="145" text-anchor="middle" fill="#DC2626" font-family="Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700">BEFORE · 假详细</text>
  <text x="80" y="200" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• 「支持智能取消」</text>
  <text x="80" y="242" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• 「体验要好、尽快退款」</text>
  <text x="80" y="284" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• 「按角色控权限」——未列角色</text>
  <text x="80" y="326" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• 「异常要有提示」——无文案</text>
  <text x="80" y="368" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• 无线框 / 无状态矩阵 / 无 AC</text>
  <text x="80" y="410" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• ready 仍挂 open_questions</text>
  <text x="80" y="470" fill="#B91C1C" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="700">→ CLI：FAIL_COUNT ≥ 1</text>
  <text x="80" y="510" fill="#991B1B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">研发猜 · Agent 瞎补 · 测试无法验收</text>

  <rect x="680" y="100" width="560" height="480" rx="16" fill="#ECFDF5" stroke="#159947" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="145" text-anchor="middle" fill="#159947" font-family="Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700">AFTER · 施工图密度</text>
  <text x="720" y="200" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• states：unpaid / paid_unshipped / …</text>
  <text x="720" y="242" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• ui.wireframe + controls 显隐条件</text>
  <text x="720" y="284" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• actors：buyer / cs / seller_ops / risk</text>
  <text x="720" y="326" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• copy.not_allowed 原文可粘贴</text>
  <text x="720" y="368" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• defaults：退款通道 / 不自动回券</text>
  <text x="720" y="410" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16">• AC：Given / When / Then 可观察</text>
  <text x="720" y="470" fill="#047857" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="700">→ CLI：FAIL=0 · WARN=0 · PASS</text>
  <text x="720" y="510" fill="#065F46" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">按表开工 · 按 AC 验收 · Pending 有主</text>

  <line x1="610" y1="340" x2="670" y2="340" stroke="#159947" stroke-width="3" marker-end="url(#arrow-green)"/>
</svg>
