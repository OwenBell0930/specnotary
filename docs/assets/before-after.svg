<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
<defs>
  <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#0B6BCB"/>
  </marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#159947"/>
  </marker>
  <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#DC2626"/>
  </marker>
</defs>
<rect width="1280" height="640" fill="#F8FAFC"/>
<text x="640" y="36" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="700">Case demo: Fake-detailed PRD → Dev-ready machine spec</text><text x="640" y="64" text-anchor="middle" fill="#475569" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="400">案例：假详细需求 → 可开发机读规格（节选对照）</text><rect x="40" y="100" width="560" height="480" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/><text x="320" y="130" text-anchor="middle" fill="#DC2626" font-family="Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700">BEFORE / 改造前</text><text x="70" y="175" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• 「支持智能搜索」</text><text x="70" y="217" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• 「体验要好、尽量快」</text><text x="70" y="259" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• 「权限按角色区分」——未列角色</text><text x="70" y="301" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• 「异常要有提示」——未写文案/码</text><text x="70" y="343" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• 无默认值 · 无空结果 · 无验收</text><text x="70" y="385" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• → 研发只能猜，Agent 会瞎补</text><rect x="680" y="100" width="560" height="480" rx="16" fill="#ECFDF5" stroke="#159947" stroke-width="2"/><text x="960" y="130" text-anchor="middle" fill="#159947" font-family="Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700">AFTER / 改造后（机读字段）</text><text x="710" y="175" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• search.fields: [title, id]</text><text x="710" y="217" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• search.match: fuzzy</text><text x="710" y="259" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• actors: [admin, member]</text><text x="710" y="301" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• empty_state: 「无匹配结果」</text><text x="710" y="343" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• defaults.page_size: 20</text><text x="710" y="385" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• acceptance: Given/When/Then × N</text><text x="710" y="427" text-anchor="start" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400">• → CLI hard gate: PASS</text><line x1="600" y1="340" x2="680" y2="340" stroke="#159947" stroke-width="2.5" marker-end="url(#arrow-green)"/></svg>
