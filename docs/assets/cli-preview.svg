<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="CLI gate preview">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="#0B1220"/>
  <text x="640" y="40" text-anchor="middle" fill="#F8FAFC" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700">CLI Gate Preview · 门禁预览</text>
  <rect x="60" y="70" width="560" height="300" rx="14" fill="#020617" stroke="#7F1D1D" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="110" fill="#F87171" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="700">BAD · case-order-cancel-bad</text>
  <text x="90" y="150" fill="#93C5FD" font-family="Menlo,Consolas,monospace" font-size="14">$ ./cli/run-check.sh …/spec.yaml</text>
  <text x="90" y="184" fill="#94A3B8" font-family="Menlo,Consolas,monospace" font-size="13">gate_mode: hard</text>
  <text x="90" y="214" fill="#F87171" font-family="Menlo,Consolas,monospace" font-size="13">FAIL_COUNT: 7</text>
  <text x="90" y="244" fill="#FBBF24" font-family="Menlo,Consolas,monospace" font-size="13">WARN_COUNT: 4</text>
  <text x="90" y="280" fill="#FCA5A5" font-family="Menlo,Consolas,monospace" font-size="12">FAIL: missing ui / states / actors</text>
  <text x="90" y="306" fill="#FCA5A5" font-family="Menlo,Consolas,monospace" font-size="12">FAIL: AC not observable</text>
  <text x="90" y="332" fill="#F87171" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="700">RESULT: FAIL</text>

  <rect x="660" y="70" width="560" height="300" rx="14" fill="#020617" stroke="#14532D" stroke-width="2" filter="url(#shadow)"/>
  <text x="690" y="110" fill="#4ADE80" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="700">READY · case-order-cancel-raw</text>
  <text x="690" y="150" fill="#93C5FD" font-family="Menlo,Consolas,monospace" font-size="14">$ ./cli/run-check.sh …/spec.yaml</text>
  <text x="690" y="184" fill="#94A3B8" font-family="Menlo,Consolas,monospace" font-size="13">gate_mode: hard</text>
  <text x="690" y="214" fill="#4ADE80" font-family="Menlo,Consolas,monospace" font-size="13">FAIL_COUNT: 0</text>
  <text x="690" y="244" fill="#4ADE80" font-family="Menlo,Consolas,monospace" font-size="13">WARN_COUNT: 0</text>
  <text x="690" y="280" fill="#86EFAC" font-family="Menlo,Consolas,monospace" font-size="12">ui · states · actors · defaults · AC</text>
  <text x="690" y="306" fill="#86EFAC" font-family="Menlo,Consolas,monospace" font-size="12">Pending four-fields cleared or owned</text>
  <text x="690" y="332" fill="#4ADE80" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="700">RESULT: PASS</text>
