<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Architecture">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0B6BCB"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#F8FAFC"/>
  <text x="640" y="40" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="700">What's in the box · 仓库构成</text>

  <rect x="60" y="90" width="360" height="130" rx="14" fill="#E8F3FF" stroke="#0B6BCB" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="145" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700">Scaffold</text>
  <text x="240" y="175" text-anchor="middle" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">templates · examples · docs</text>

  <rect x="460" y="90" width="360" height="130" rx="14" fill="#FFFFFF" stroke="#0B6BCB" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="145" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700">CLI</text>
  <text x="640" y="175" text-anchor="middle" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">run-check · generate-human</text>

  <rect x="860" y="90" width="360" height="130" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="145" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700">Skill</text>
  <text x="1040" y="175" text-anchor="middle" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">起草 · 无运行时降级</text>

  <rect x="160" y="300" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#074A8C" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="365" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700">Machine source</text>
  <text x="380" y="398" text-anchor="middle" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">YAML/JSON · 唯一真相源</text>

  <rect x="680" y="300" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#0B6BCB" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="365" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700">Human view</text>
  <text x="900" y="398" text-anchor="middle" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">线框 · 控件 · 状态 · AC · Pending</text>

  <line x1="240" y1="220" x2="300" y2="300" stroke="#0B6BCB" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="220" x2="640" y2="300" stroke="#0B6BCB" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="220" x2="960" y2="300" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="640" y="510" text-anchor="middle" fill="#64748B" font-family="Helvetica Neue,Arial,sans-serif" font-size="14">上游 PRD / 工单 / FAQ = 原料 · 本仓产出 = 可开发规格层</text>
</svg>
