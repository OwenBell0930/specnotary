name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Full regression
        run: python3 tests/test_cli.py
      - name: Gate the shipped examples
        run: |
          ./cli/run-check.sh examples/case-order-cancel-raw/machine/spec.yaml
          ./cli/run-check.sh examples/case-list-search/machine/spec.yaml
          ./cli/run-check.sh templates/machine/spec.template.yaml
      - name: Installed console script works
        run: |
          specanvil --version
          specanvil check examples/case-order-cancel-raw/machine/spec.yaml
