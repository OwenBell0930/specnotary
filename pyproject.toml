[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specnotary"
version = "0.2.0"
description = "Forge dev-ready specs on a hard gate: machine-first specs, human construction views, and review-readiness evidence (FAIL/WARN/Pending)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OwenBell" }]
keywords = ["specification", "requirements", "spec-driven-development", "gate", "prd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.scripts]
specnotary = "specnotary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specnotary = ["schemas/*.json"]
