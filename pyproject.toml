[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specnotary"
version = "0.3.0"
description = "Turn raw requirements into review-ready product specs with a machine source, a readable review pack, and deterministic evidence checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OwenBell" }]
keywords = ["specification", "requirements", "product-management", "requirements-review", "prd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.scripts]
specnotary = "specnotary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specnotary = ["schemas/*.json", "templates/*.yaml"]
