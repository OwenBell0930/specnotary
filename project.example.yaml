# project declaration (example) — copy to project.yaml
# 项目声明示例：复制为 project.yaml 后按项目修改

name: example-product
locale: zh-CN          # zh-CN | en-US | bilingual
# object_ai_weight: how heavy AI features are in THIS product being specified
# 对象 AI 权重：本产品里 AI 能力占比（由 LLM 判断或询问用户后写入）
object_ai_weight: medium   # low | medium | high
object_ai_notes: ""        # why this weight / 权重理由

# paths relative to repo root
machine_spec: examples/sample.machine.yaml
human_spec_out: examples/sample.human.md
