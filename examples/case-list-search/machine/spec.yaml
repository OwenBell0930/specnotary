spec_version: "0.1"
id: SPEC-LIST-SEARCH-001
title:
  zh: 商品列表 · 标题/ID 搜索
  en: Product list · Title/ID search
status: ready
baseline:
  zh: 虚构自营商城后台商品列表（不含向量检索）
in_scope:
  - zh: 按商品标题模糊匹配
  - zh: 按商品 ID 精确匹配
  - zh: 空结果展示固定文案
out_of_scope:
  - zh: 语义检索、同义词扩展、跨店聚合
actors:
  - id: merchant_ops
    zh: 商家运营
  - id: platform_admin
    zh: 平台管理员
permissions:
  - actor: merchant_ops
    can: [search_own_products]
  - actor: platform_admin
    can: [search_all_products]
defaults:
  page_size: 20
  match_mode: fuzzy_title_or_exact_id
  max_keyword_len: 64
states:
  lifecycle:
    - idle
    - searching
    - results
    - empty
  labels:
    idle:
      zh: 空闲
      of: 商品列表
    searching:
      zh: 检索中
      of: 商品列表
    results:
      zh: 有结果
      of: 商品列表
    empty:
      zh: 无结果
      of: 商品列表
  action_labels:
    submit_search:
      zh: 提交搜索
  action_matrix:
    - state: idle
      action: submit_search
      allowed: true
      zh: 可提交关键词
    - state: searching
      action: submit_search
      allowed: false
      zh: 请求进行中，按钮置灰
    - state: results
      action: submit_search
      allowed: true
      zh: 可再次搜索
    - state: empty
      action: submit_search
      allowed: true
      zh: 可修改关键词重试
ui:
  entry:
    zh: 商品列表页顶部搜索栏
  wireframe: |
    ┌─ 商品列表 ────────────────────────────┐
    │ [关键词________] [搜索]               │
    │ 结果表… / 空态文案                    │
    └───────────────────────────────────────┘
  controls:
    - id: inp_keyword
      zh: 请输入标题或商品 ID
      visible_when:
        zh: 始终
      action:
        zh: 输入
      fail_feedback:
        zh: —
    - id: btn_search
      zh: 搜索
      visible_when:
        zh: 始终；searching 时置灰
      action:
        zh: 提交搜索
      fail_feedback:
        zh: 搜索失败，请稍后重试
empty_states:
  no_match:
    zh: 无匹配商品，请调整关键词
  keyword_too_long:
    zh: 关键词最长 64 字
object_ai:
  enabled: false
behaviors:
  - id: B1
    step_id: 1
    name:
      zh: 标题模糊搜索
    given:
      zh: 运营在商品列表页，列表有数据
    when:
      zh: 输入标题片段并点击搜索
    then:
      zh: 返回标题包含关键词的商品，按更新时间倒序，每页 20 条
  - id: B2
    step_id: 2
    name:
      zh: 空结果
    given:
      zh: 关键词无匹配
    when:
      zh: 点击搜索
    then:
      zh: 列表为空，展示文案「无匹配商品，请调整关键词」
  - id: B3
    step_id: 3
    name:
      zh: 商品 ID 精确匹配
    given:
      zh: 运营在商品列表页，已知某商品 ID
    when:
      zh: 输入完整商品 ID 并点击搜索
    then:
      zh: 仅返回该 ID 对应的一行商品；ID 不存在则走空结果分支
acceptance:
  - id: AC-01
    behavior: B1
    zh: 输入「蓝牙」可看到标题含「蓝牙」的商品行
  - id: AC-02
    behavior: B2
    zh: 输入不存在关键词时页面展示固定空态文案
  - id: AC-03
    behavior: B3
    zh: 输入已存在的完整商品 ID 时结果有且仅有该商品一行；输入不存在的 ID 时展示空态文案
pending: []
overview:
  summary:
    zh: 商城后台商品列表新增标题模糊 / ID 精确搜索：默认每页 20 条、按更新时间倒序，空结果与超长关键词均有固定文案。不做语义检索。
  design_principles:
    - zh: 匹配模式与分页参数全部落 defaults，不留口头约定
    - zh: 空态文案原文入库，界面逐字使用
architecture:
  note:
    zh: 商品列表页由搜索条件、结果列表、商品行和空态组成；本图只描述产品页面与信息对象，不表示技术调用关系。
  mermaid: |-
    flowchart LR
      User["商家运营 / 平台管理员"] --> Search["搜索条件区"]
      Search --> Result["商品结果列表"]
      Result --> Row["商品行"]
      Result --> Empty["无匹配空态"]
responsibilities:
  - role: search_area
    zh: 搜索条件区
    owns:
      - zh: 接收标题片段或完整商品 ID
      - zh: 展示输入长度限制与搜索中状态
    not_owns:
      - zh: 语义检索、同义词扩展
  - role: result_area
    zh: 商品结果区
    owns:
      - zh: 展示匹配商品、排序与分页结果
      - zh: 展示无匹配和搜索失败文案
    not_owns:
      - zh: 商品编辑与批量操作
data_contracts:
  - id: SearchCondition
    zh: 商品搜索条件
    fields:
      - name: keyword
        zh: 搜索关键词
        type: string
        desc:
          zh: 标题片段或完整商品 ID，最长 64 字
      - name: match_mode
        zh: 匹配方式
        type: enum
        desc:
          zh: 完整商品 ID 精确匹配，否则按标题模糊匹配
      - name: page_size
        zh: 每页条数
        type: number
        desc:
          zh: 默认 20
    rules:
      - zh: 搜索进行中不可重复提交
  - id: SearchResult
    zh: 商品搜索结果
    fields:
      - name: items
        zh: 商品行集合
        type: array
        desc:
          zh: 按更新时间倒序展示
      - name: total
        zh: 匹配总数
        type: number
        desc:
          zh: 无匹配时为 0
      - name: empty_message
        zh: 空态文案
        type: string
        desc:
          zh: total=0 时展示 no_match 原文
error_codes:
  - code: KEYWORD_TOO_LONG
    zh: 关键词超过长度上限
    trigger:
      zh: 输入超过 64 字后提交
    retryable: true
    user_copy:
      zh: 关键词最长 64 字
  - code: SEARCH_FAILED
    zh: 商品搜索失败
    trigger:
      zh: 搜索请求未得到可展示结果
    retryable: true
    user_copy:
      zh: 搜索失败，请稍后重试
decisions:
  - id: D-PROTOTYPE
    question:
      zh: 本次需求评审是否需要可交互原型？如需要，采用什么载体？
    options:
      - id: no_prototype
        zh: 不需要原型，仅评审标准文档
      - id: static_html
        zh: 静态 HTML，可直接打开
      - id: local_service
        zh: 本地服务，可运行交互流程
      - id: other
        zh: 其他载体
    chosen: no_prototype
    status: decided
    date: "2026-08-24"
    note:
      zh: 列表搜索规则可通过线框、状态表和控件表完成评审，本样例不制作交互原型。
sources:
  - id: SRC-LS-001
    kind: ops_note
    path: ../input/ops-note.zh.txt
    content_hash: deede9ca28da4967b09834c11effe2b7dec4df062e9f998d51ae06a37605099b
    status: registered
source_claims:
  - id: SRC-CLM-LS-01
    source_ref: SRC-LS-001
    quote_or_summary: 按标题模糊搜、按商品 ID 精确搜
    evidence: ops-note.zh.txt:L2
    kind: requirement
    disposition: covered
    spec_refs: [B1, AC-01, B3, AC-03, inp_keyword, btn_search]
    confidence: high
  - id: SRC-CLM-LS-02
    source_ref: SRC-LS-001
    quote_or_summary: 无匹配时展示固定空态文案
    evidence: ops-note.zh.txt:L3
    kind: requirement
    disposition: covered
    spec_refs: [B2, AC-02]
    confidence: high
  - id: SRC-CLM-LS-03
    source_ref: SRC-LS-001
    quote_or_summary: 不做语义检索
    evidence: ops-note.zh.txt:L4
    kind: constraint
    disposition: out_of_scope
    confidence: high
  - id: SRC-CLM-LS-04
    source_ref: SRC-LS-001
    quote_or_summary: 默认每页 20 条（原料未写死，产品补默认）
    evidence: 推导
    kind: assumption
    disposition: assumption
    spec_refs: [defaults.page_size]
    confidence: medium
