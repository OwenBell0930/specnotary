spec_version: "0.1"
id: SPEC-EXPENSE-001
title:
  zh: 报销助手 · 发票识别与审批
  en: Expense assist · Invoice OCR & approval
status: ready
in_scope:
  - zh: 发票图片识别金额与日期并生成草稿
    en: OCR amount/date from invoice image into draft
  - zh: 经理审批通过/驳回（驳回必填原因）
    en: Manager approve/reject with mandatory reject reason
out_of_scope:
  - zh: 自动打款与税务申报
    en: Auto payout and tax filing
open_questions: []
actors:
  - id: employee
    zh: 员工
    en: Employee
  - id: manager
    zh: 经理
    en: Manager
permissions:
  - actor: employee
    can: [upload, edit_draft_amount_date, submit]
  - actor: manager
    can: [approve, reject]
object_ai:
  enabled: true
  tools_boundary:
    - zh: 仅允许调用发票 OCR；不得调用外部支付
      en: Invoice OCR only; no external payment tools
  failure_fallback:
    zh: OCR 失败则进入全手工录入金额与日期
    en: On OCR failure, fall back to full manual amount/date entry
  human_takeover_when:
    - zh: 模型置信度 < 0.7
      en: Model confidence < 0.7
  unacceptable_outputs:
    - zh: 编造不存在的发票号或供应商
      en: Invented invoice numbers or vendors
  confidence_threshold: 0.7
defaults:
  currency: CNY
  currency_editable: false
  reject_reason_min_chars: 5
behaviors:
  - id: B1
    name:
      zh: 上传并生成草稿
      en: Upload and create draft
    given:
      zh: 员工已登录
      en: Employee signed in
    when:
      zh: 上传发票图片
      en: Uploads invoice image
    then:
      zh: 生成含金额、日期、币种=CNY 的草稿；置信度<0.7 时标黄并阻止提交直至人工确认
      en: Create draft with amount, date, currency=CNY; if confidence<0.7 mark amber and block submit until human confirm
  - id: B2
    name:
      zh: 经理驳回
      en: Manager reject
    given:
      zh: 草稿处于待审批
      en: Draft pending approval
    when:
      zh: 经理驳回
      en: Manager rejects
    then:
      zh: 必须填写不少于 5 字原因，否则无法提交驳回
      en: Require reject reason ≥5 chars or reject action fails
acceptance:
  - id: A1
    behavior: B1
    zh: Given 置信度 0.65 When 员工点提交 Then 被阻断并提示需人工核对
    en: Given confidence 0.65 When employee submits Then block with human-check prompt
  - id: A2
    behavior: B2
    zh: Given 待审批 When 经理驳回原因为 3 个字 Then 无法完成驳回
    en: Given pending When reject reason has 3 chars Then reject cannot complete
project_hint:
  object_ai_weight: high
  object_ai_notes:
    zh: 发票 OCR 与置信度门禁是主路径
    en: Invoice OCR and confidence gate are on the primary path
