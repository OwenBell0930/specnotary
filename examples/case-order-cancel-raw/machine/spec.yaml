spec_version: '0.1'
id: SPEC-ORDER-CANCEL-001
title:
  zh: 电商订单 · 未发货自助取消
  en: Commerce order · Buyer self-cancel before shipment
status: ready
baseline:
  zh: 虚构自营商城 App 现网交易链路（不含跨境与订阅购）
  en: Fictional retail app checkout (no cross-border / subscription)
in_scope:
- zh: 待支付订单买家自助取消并释放锁定优惠券
- zh: 已支付未发货订单买家自助取消、原路退款、库存立即回库
- zh: 履约中/已发货不可自助取消，引导客服或售后
out_of_scope:
- zh: 部分取消、改地址、跨境税、订阅购、已支付取消自动回券
actors:
- id: buyer
  zh: 买家（下单人）
- id: cs_agent
  zh: 客服
- id: seller_ops
  zh: 商家运营
- id: risk_engine
  zh: 风控引擎（系统）
permissions:
- actor: buyer
  can:
  - cancel_unpaid
  - cancel_paid_unshipped
  - view_refund_progress
- actor: cs_agent
  can:
  - force_cancel_with_reason
- actor: seller_ops
  can:
  - view_cancel_logs
- actor: risk_engine
  can:
  - flag_block_self_cancel
defaults:
  refund_path: original
  refund_visible_sla_hours: 2
  inventory_release: immediate_on_cancel_success
  coupon_release_on_unpaid_cancel: true
  coupon_return_on_paid_cancel: false
  confirm_dialog_required: true
  risk_block_self_cancel: true
states:
  lifecycle:
  - unpaid
  - paid_unshipped
  - fulfilling
  - shipped
  - completed
  - cancelled
  action_matrix:
  - state: unpaid
    action: buyer_self_cancel
    allowed: true
    zh: 取消后关单，释放锁券，无退款单
  - state: paid_unshipped
    action: buyer_self_cancel
    allowed: true
    zh: 取消后原路退款+回库；不自动回券
  - state: fulfilling
    action: buyer_self_cancel
    allowed: false
    zh: 按钮隐藏或置灰，文案 not_allowed
  - state: shipped
    action: buyer_self_cancel
    allowed: false
    zh: 引导售后
  - state: completed
    action: buyer_self_cancel
    allowed: false
    zh: 无取消入口
  - state: cancelled
    action: buyer_self_cancel
    allowed: false
    zh: 已取消，展示退款进度入口（若有退款单）
ui:
  entry:
    zh: 订单详情页（买家端）右下操作区；订单列表「更多」内同步暴露同一规则
  wireframe: '┌─ 订单详情 ─────────────────────────────────────┐

    │ 订单号 ORD***        状态：已支付待发货          │

    │ 商品行…                                          │

    │                                                  │

    │  [联系客服]     [申请售后]     [取消订单]         │

    └──────────────────────────────────────────────────┘

    点击「取消订单」→ 确认弹窗：

    ┌─ 取消订单？ ─────────────────┐

    │ 取消后将原路退款，库存回库。   │

    │ 优惠券不自动退回。             │

    │  [再想想]      [确认取消]     │

    └──────────────────────────────┘

    '
  controls:
  - id: btn_cancel
    zh: 取消订单
    visible_when:
      zh: 买家本人且状态∈{unpaid,paid_unshipped}且风控未拦截
    action:
      zh: 打开确认弹窗
    fail_feedback:
      zh: —
  - id: btn_cancel_disabled
    zh: 取消订单（置灰）
    visible_when:
      zh: 状态∈{fulfilling,shipped}（也可直接隐藏，二选一：本期=置灰+点击仍提示）
    action:
      zh: Toast 展示 not_allowed，并给出客服/售后入口
    fail_feedback:
      zh: 当前订单状态不支持自助取消，请联系客服或去售后中心
  - id: dlg_confirm_title
    zh: 取消订单？
    visible_when:
      zh: 确认弹窗打开时
    action:
      zh: —
    fail_feedback:
      zh: —
  - id: dlg_confirm_ok
    zh: 确认取消
    visible_when:
      zh: 确认弹窗打开时
    action:
      zh: 提交取消；成功后关弹窗并刷新详情
    fail_feedback:
      zh: 取消失败，请稍后重试（网络/支付通道异常时）
  - id: dlg_confirm_cancel
    zh: 再想想
    visible_when:
      zh: 确认弹窗打开时
    action:
      zh: 关闭弹窗，订单不变
    fail_feedback:
      zh: —
empty_states:
  not_allowed:
    zh: 当前订单状态不支持自助取消，请联系客服或去售后中心
  risk_blocked:
    zh: 订单存在风险控制，暂不可自助取消
  refund_pending:
    zh: 取消成功，退款处理中，预计可在 2 小时内查询到账进度
  cancel_failed:
    zh: 取消失败，请稍后重试
object_ai:
  enabled: false
  tools_boundary: []
  failure_fallback: ''
  human_takeover_when: []
  unacceptable_outputs: []
behaviors:
- id: B1
  step_id: '1'
  name:
    zh: 取消待支付订单
  given:
    zh: 买家登录且为下单人；订单状态=unpaid；风控未拦截
  when:
    zh: 点击「取消订单」并在弹窗点「确认取消」
  then:
    zh: 订单状态变为 cancelled；不创建退款单；已锁定优惠券释放为可再用；若有预占库存则释放
  side_effects:
  - zh: 列表与详情刷新后不再显示「取消订单」
- id: B2
  step_id: '2'
  name:
    zh: 取消已支付未发货订单
  given:
    zh: 买家登录且为下单人；订单状态=paid_unshipped；风控未拦截
  when:
    zh: 点击「取消订单」并确认
  then:
    zh: 订单状态变为 cancelled；创建 refund_path=original 的退款单；库存立即回库；页面展示 refund_pending 文案；优惠券不自动退回
  side_effects:
  - zh: 「退款进度」入口对买家可见
- id: B3
  step_id: '3'
  name:
    zh: 履约中/已发货拦截
  given:
    zh: 订单状态=fulfilling 或 shipped
  when:
    zh: 买家点击置灰的「取消订单」或寻找取消入口
  then:
    zh: 订单状态不变；展示 not_allowed；提供客服与售后入口
- id: B4
  step_id: '4'
  name:
    zh: 风控拦截
  given:
    zh: 订单被 risk_engine 标记禁止自助取消
  when:
    zh: 买家点击「取消订单」
  then:
    zh: 不打开成功确认提交；展示 risk_blocked；订单状态不变
acceptance:
- id: AC-01
  behavior: B1
  zh: Given 待支付订单 When 确认取消 Then 状态=cancelled 且无退款单且原锁定券可再次下单使用
- id: AC-02
  behavior: B2
  zh: Given 已支付未发货且购买数量=1 When 确认取消 Then 对应 SKU 可用库存 +1 且存在原路退款单
- id: AC-03
  behavior: B2
  zh: Given 取消成功 When 买家打开退款进度 Then 2 小时内可查询到非空进度状态（成功/处理中/失败三者之一）
- id: AC-04
  behavior: B3
  zh: Given 履约中 When 点击取消 Then 状态仍为 fulfilling 且 Toast/文案为 not_allowed 原文
- id: AC-05
  behavior: B4
  zh: Given 风控拦截单 When 点击取消 Then 展示 risk_blocked 原文且无退款单创建
pending: []
overview:
  summary:
    zh: 买家在订单详情页自助取消订单：待支付直接关单释券；已支付未发货原路退款回库；履约中与风控命中一律拦截并给出原文文案。本规格覆盖取消入口的显隐、确认弹窗、四条状态分支与退款可查性。
  design_principles:
    - zh: 状态×动作矩阵是唯一准据；前端显隐置灰不得自行发明规则
    - zh: 拦截与失败文案原文入库，界面逐字使用，不得二次创作
    - zh: 退款异步执行，但两小时内必须可查到进度
  environment_constraints:
    - zh: 本期不接人工客服链路；拦截场景仅提示文案引导
    - zh: 优惠券释放依赖营销服务回调，超时按未释放告警处理
architecture:
  note:
    zh: 取消动作由订单服务编排；支付、库存、优惠券、风控均为被调用方。
  mermaid: |-
    flowchart LR
      Buyer["买家 · 订单详情页"] --> OrderSvc["订单服务（状态机 + 编排）"]
      OrderSvc --> Pay["支付服务：原路退款"]
      OrderSvc --> Stock["库存服务：回库"]
      OrderSvc --> Coupon["营销服务：释券"]
      OrderSvc --> Risk["风控服务：拦截判定"]
      OrderSvc --> Copy["文案库：拦截/失败原文"]
responsibilities:
  - role: order_service
    zh: 订单服务
    owns:
      - zh: 取消状态机与动作矩阵判定
      - zh: 退款单/回库/释券的编排与补偿
      - zh: 拦截与失败文案聚合下发
    not_owns:
      - zh: 支付通道内部实现
      - zh: 风控命中与否的判定逻辑
  - role: risk_service
    zh: 风控服务
    owns:
      - zh: 取消前拦截判定（同步接口）
    not_owns:
      - zh: 拦截后的用户提示文案
  - role: frontend
    zh: 买家端前端
    owns:
      - zh: 按矩阵实现按钮显隐/置灰与弹窗
      - zh: 逐字展示 empty_states 文案
    not_owns:
      - zh: 任何状态判定与重试策略
data_contracts:
  - id: CancelRequest
    zh: 取消请求
    fields:
      - name: order_id
        zh: 订单号
        type: string
        desc:
          zh: 待取消订单
      - name: buyer_id
        zh: 买家标识
        type: string
        desc:
          zh: 必须与订单归属一致，否则拒绝
      - name: reason_code
        zh: 取消原因码
        type: string
        desc:
          zh: 枚举见运营配置；可空
    rules:
      - zh: 幂等：同一 order_id 重复提交返回首次结果
      - zh: 服务端以状态矩阵二次校验，不信任前端判定
  - id: CancelResult
    zh: 取消结果
    fields:
      - name: status
        zh: 结果状态
        type: enum
        desc:
          zh: closed / refund_pending / rejected
      - name: refund_eta_hours
        zh: 退款可查时限
        type: number
        desc:
          zh: 已支付场景固定 2
      - name: message_key
        zh: 文案键
        type: string
        desc:
          zh: 指向 empty_states 键名，前端取原文展示
    rules:
      - zh: rejected 时 message_key 必填且必须命中已入库文案
error_codes:
  - code: CANCEL_NOT_ALLOWED
    zh: 当前状态不可自助取消
    trigger:
      zh: 状态 ∈ {fulfilling, shipped} 时提交取消
    retryable: false
    user_copy:
      zh: 当前订单状态不支持自助取消，请联系客服或去售后中心
  - code: RISK_BLOCKED
    zh: 风控拦截
    trigger:
      zh: 风控服务返回命中
    retryable: false
    user_copy:
      zh: 订单存在风险控制，暂不可自助取消
  - code: CANCEL_FAILED
    zh: 取消执行失败
    trigger:
      zh: 支付通道或网络异常
    retryable: true
    user_copy:
      zh: 取消失败，请稍后重试
decisions:
  - id: D-01
    question:
      zh: 已支付订单取消后，锁定的优惠券是否自动回券？
    options:
      - id: A
        zh: 自动回券
      - id: B
        zh: 不自动回券，走客服申诉
    chosen: B
    status: decided
    date: "2026-08-07"
    note:
      zh: 与运营约束第 2 条一致；回券涉及营销预算，本期不自动化
  - id: D-02
    question:
      zh: 履约中订单是否开放自助取消？
    options:
      - id: A
        zh: 开放，走拦截确认
      - id: B
        zh: 不开放，仅文案引导联系客服
    chosen: B
    status: decided
    date: "2026-08-07"
    note:
      zh: 履约成本与逆向物流复杂度高，本期锁死
project_hint:
  object_ai_weight: low
  object_ai_notes:
    zh: 本期无模型决策
sources:
  - id: SRC-001
    kind: ops_request
    path: ../input/ops-request.zh.txt
    status: registered
    zh: 运营需求摘录
source_claims:
  - id: SRC-CLM-001
    source_ref: SRC-001
    quote_or_summary: 待支付订单取消后应关闭，并释放优惠券（若已锁定）
    evidence: ops-request.zh.txt:约束第1条
    kind: requirement
    disposition: covered
    spec_refs: [B1, AC-01, btn_cancel, dlg_confirm_title, dlg_confirm_ok, dlg_confirm_cancel]
    confidence: high
  - id: SRC-CLM-002
    source_ref: SRC-001
    quote_or_summary: 已支付未发货取消后须原路退款、库存回库，2小时内退款状态可查
    evidence: ops-request.zh.txt:约束第2条
    kind: requirement
    disposition: covered
    spec_refs: [B2, AC-02, AC-03, btn_cancel]
    confidence: high
  - id: SRC-CLM-003
    source_ref: SRC-001
    quote_or_summary: 履约中买家不可自助取消，只能联系客服
    evidence: ops-request.zh.txt:约束第3条
    kind: requirement
    disposition: covered
    spec_refs: [B3, AC-04, btn_cancel_disabled]
    confidence: high
  - id: SRC-CLM-004
    source_ref: SRC-001
    quote_or_summary: 风控命中订单禁止自助取消
    evidence: ops-request.zh.txt:约束第4条
    kind: requirement
    disposition: covered
    spec_refs: [B4, AC-05]
    confidence: high
  - id: SRC-CLM-005
    source_ref: SRC-001
    quote_or_summary: 部分取消、改地址、跨境税、订阅购不在本期
    evidence: ops-request.zh.txt:非目标
    kind: constraint
    disposition: out_of_scope
    spec_refs: []
    confidence: high
