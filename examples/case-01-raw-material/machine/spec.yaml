spec_version: "0.1"
id: SPEC-SHELF-001
title:
  zh: 书架助手 · 文档搜索与索引重建
  en: ShelfHelp · Document search & index rebuild
status: ready
in_scope:
  - zh: 按标题、文档编号模糊搜索
    en: Fuzzy search by title and document id
  - zh: 成员只读；管理员可触发索引重建
    en: Members read-only; admins can rebuild index
out_of_scope:
  - zh: 全文语义问答 / RAG 回答
    en: Semantic QA / RAG answers
open_questions: []
actors:
  - id: member
    zh: 成员
    en: Member
  - id: admin
    zh: 管理员
    en: Admin
permissions:
  - actor: member
    can: [search, view_result]
  - actor: admin
    can: [search, view_result, rebuild_index]
object_ai:
  enabled: false
  tools_boundary: []
  failure_fallback: ""
  human_takeover_when: []
  unacceptable_outputs: []
defaults:
  page_size: 20
  search_match: fuzzy
  search_fields: [title, doc_id]
  max_concurrent_rebuilds: 1
empty_states:
  no_match:
    zh: 没有找到匹配的文档。试试编号或换个关键词。
    en: No matching documents. Try an id or another keyword.
  no_permission:
    zh: 你没有权限查看该文档。
    en: You do not have permission to view this document.
behaviors:
  - id: B1
    name:
      zh: 搜索文档
      en: Search documents
    given:
      zh: 用户已登录且具备 search 权限
      en: User is signed in with search permission
    when:
      zh: 输入关键词并提交搜索
      en: User submits a keyword search
    then:
      zh: 返回匹配列表；字段含 title、doc_id；分页大小默认 20；无匹配展示 no_match 文案
      en: Return matches with title and doc_id; default page size 20; show no_match copy when empty
  - id: B2
    name:
      zh: 重建索引
      en: Rebuild index
    given:
      zh: 用户为 admin，且当前没有进行中的重建任务
      en: User is admin and no rebuild is running
    when:
      zh: 点击重建索引
      en: Clicks rebuild index
    then:
      zh: 创建唯一重建任务；若已有任务则拒绝并提示「已有重建进行中」
      en: Start the only rebuild job; if one exists, reject with in-progress message
acceptance:
  - id: A1
    behavior: B1
    zh: Given 成员已登录 When 搜索不存在的关键词 Then 看到 no_match 中文案且不暴露他人私有路径
    en: Given member signed in When searching a missing keyword Then see no_match copy without leaking private paths
  - id: A2
    behavior: B2
    zh: Given 已有重建任务 When admin 再次点击重建 Then 被拒绝且提示进行中
    en: Given a rebuild is running When admin clicks rebuild again Then reject with in-progress message
