spec_version: "0.1"
id: SPEC-TICKET-001
title:
  zh: 工单列表搜索
  en: Ticket list search
status: ready
in_scope:
  - zh: 按工单标题、工单号模糊搜索
    en: Fuzzy search by ticket title and ticket id
  - zh: 管理员与处理人可搜全量；只读访客仅搜自己可见工单
    en: Admin/assignee search all visible; readonly guest only own-visible tickets
out_of_scope:
  - zh: 用大模型改写查询或自动结单
    en: LLM query rewrite or auto-close
open_questions: []
actors:
  - id: admin
    zh: 管理员
    en: Admin
  - id: agent
    zh: 处理人
    en: Agent
  - id: guest
    zh: 只读访客
    en: Readonly guest
permissions:
  - actor: admin
    can: [search_all]
  - actor: agent
    can: [search_all]
  - actor: guest
    can: [search_own_visible]
object_ai:
  enabled: false
  tools_boundary: []
  failure_fallback: ""
  human_takeover_when: []
  unacceptable_outputs: []
defaults:
  page_size: 20
  search_match: fuzzy
  search_fields: [title, ticket_id]
  debounce_ms: 300
empty_states:
  no_match:
    zh: 没有符合条件的工单
    en: No tickets match your filters
  forbidden:
    zh: 无权查看该工单
    en: Not allowed to view this ticket
behaviors:
  - id: B1
    name:
      zh: 搜索工单
      en: Search tickets
    given:
      zh: 用户已登录
      en: User signed in
    when:
      zh: 在搜索框输入至少 1 个字符并等待 debounce
      en: Types at least 1 character and waits for debounce
    then:
      zh: 按权限返回列表；默认 20 条；无匹配展示 no_match；越权展示 forbidden
      en: Return list by permission; default 20; no_match / forbidden copy as applicable
acceptance:
  - id: A1
    behavior: B1
    zh: Given guest When 搜索他人私有工单号 Then 不返回该工单正文并展示 forbidden 或相当于未命中的安全空态（二选一须在实现前锁定，本例锁定为 forbidden）
    en: Given guest When searching another user's private ticket id Then do not return body and show forbidden
  - id: A2
    behavior: B1
    zh: Given agent When 搜索无匹配词 Then 2 秒内展示 no_match（P95）
    en: Given agent When searching with no hits Then show no_match within 2s P95
